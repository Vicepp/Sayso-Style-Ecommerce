<!doctype html>
<html class="no-js" lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>Password — Sayso Style preview</title>
    <link rel="stylesheet" href="../assets/base.css">
    <link rel="stylesheet" href="../assets/animations.css">
    <link rel="stylesheet" href="../assets/components.css">
    <link rel="stylesheet" href="preview.css">
    <style>
      /* The real password page uses layout/password.liquid, which has no
         header or footer. Hide the shared chrome so this matches. */
      .announcement,
      sticky-header,
      .site-footer,
      .site-footer + *,
      body > section.section--flush {
        display: none !important;
      }
    </style>
  </head>

  <body class="template-password btn-square labels-upper">
    <main id="MainContent" class="main" tabindex="-1">
      <section class="password-page">
        <div class="password-page__media">
          <img src="../assets/hero-3.jpg" alt="Sayso Style" width="2400" height="1600" fetchpriority="high">
        </div>

        <div class="password-page__inner" data-reveal-group>
          <h1 class="h2" data-reveal="rise">Sayso Style</h1>
          <div class="rte text-lg" data-reveal="rise" style="opacity:.9;">
            <p>Opening soon. Leave your email and we will tell you the moment the doors are unlocked.</p>
          </div>

          <form class="newsletter-form" style="justify-content:center;" onsubmit="return false;">
            <label class="visually-hidden" for="PwEmail">Email address</label>
            <input id="PwEmail" class="input" type="email" placeholder="your@email.com" style="border-color:rgba(255,255,255,.4);color:#fff;">
            <button class="btn" type="submit" style="--btn-bg:#fff;--btn-fg:#111;--btn-border:#fff;">Sign up</button>
          </form>

          <button class="link-arrow" type="button" data-modal-open="PasswordModal" style="border-bottom-color:rgba(255,255,255,.5);">
            Enter using password
          </button>

          <ul class="social-list">
            <li><a href="#" aria-label="Instagram"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.2c3.2 0 3.6 0 4.9.07 1.2.05 1.8.25 2.2.42.6.22 1 .48 1.4.9.4.4.7.8.9 1.4.2.4.4 1 .4 2.2.1 1.3.1 1.7.1 4.9s0 3.6-.1 4.9c0 1.2-.2 1.8-.4 2.2-.2.6-.5 1-.9 1.4-.4.4-.8.7-1.4.9-.4.2-1 .4-2.2.4-1.3.1-1.7.1-4.9.1s-3.6 0-4.9-.1c-1.2 0-1.8-.2-2.2-.4-.6-.2-1-.5-1.4-.9-.4-.4-.7-.8-.9-1.4-.2-.4-.4-1-.4-2.2C2.2 15.6 2.2 15.2 2.2 12s0-3.6.1-4.9c0-1.2.2-1.8.4-2.2.2-.6.5-1 .9-1.4.4-.4.8-.7 1.4-.9.4-.2 1-.4 2.2-.4C8.4 2.2 8.8 2.2 12 2.2Zm0 4.9a4.9 4.9 0 1 1 0 9.8 4.9 4.9 0 0 1 0-9.8Zm0 8.1a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Zm6.2-8.3a1.15 1.15 0 1 1-2.3 0 1.15 1.15 0 0 1 2.3 0Z"/></svg></a></li>
            <li><a href="#" aria-label="TikTok"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 2.5h-3v13.1a2.6 2.6 0 1 1-2.2-2.57v-3.05a5.65 5.65 0 1 0 5.2 5.62V9.2a6.6 6.6 0 0 0 3.9 1.26V7.4a3.75 3.75 0 0 1-3.9-3.6v-1.3Z"/></svg></a></li>
          </ul>
        </div>
      </section>
    </main>

    <modal-element id="PasswordModal" class="modal" aria-hidden="true">
      <div class="modal__panel" style="max-width:42rem;padding:3.2rem;">
        <button class="icon-btn" type="button" data-modal-close aria-label="Close" style="position:absolute;top:.8rem;right:.8rem;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="m5.5 5.5 13 13M18.5 5.5l-13 13"/></svg>
        </button>
        <h2 class="h5" style="margin-bottom:1.6rem;">Enter using password</h2>
        <form class="stack" onsubmit="return false;">
          <div class="field">
            <label class="field__label" for="StorefrontPassword">Password</label>
            <input id="StorefrontPassword" class="input" type="password" placeholder="Your password">
          </div>
          <button class="btn btn--full" type="submit">Enter</button>
        </form>
        <p class="text-sm text-muted" style="margin-top:1.6rem;">Are you the store owner? <a href="#" class="link-underline">Log in here</a></p>
      </div>
    </modal-element>

    <script src="preview-chrome.js" defer></script>
    <script src="../assets/theme.js" defer></script>
  </body>
</html>
